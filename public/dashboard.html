<!DOCTYPE html>
<html>
<head>
    <title>CARITAS HALL BOOKING</title>

    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>

    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #007bff;
            margin: 0;
            padding: 20px;
            overflow: hidden;
        }

        h2 {
            text-align: center;
            color: white;
        }

        .container {
            max-width: 1400px;
            margin: auto;
        }

        .main-layout {
            display: flex;
            gap: 20px;
            height: 85vh;
        }

        .left-panel {
            width: 350px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .right-panel {
            flex: 1;
            display: flex;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 12px;
        }

        .row {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }

        select, input {
            flex: 1;
            padding: 8px;
            border-radius: 8px;
            border: 1px solid #ccc;
        }

        button {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(135deg, rgb(61,61,210), #0056d2);
            color: white;
            cursor: pointer;
        }

        #calendar {
            flex: 1;
            background: white;
            padding: 10px;
            border-radius: 12px;
        }

      /* OVERLAY */
#popup {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;

    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(4px);

    z-index: 9999;
}

/* CARD */
.popup-card {
    background: white;
    width: 360px;
    padding: 20px;
    margin: 120px auto;
    border-radius: 12px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.4);
}

/* HEADER */
.popup-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 15px;
}

/* TITLE */
.popup-header h3 {
    margin: 0;
    color: #333;
}

/* CLOSE BUTTON */
.close-btn {
    background: #ff4d4d;
    border: none;
    color: white;
    padding: 6px 10px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
}

.close-btn:hover {
    background: #cc0000;
}
.delete-btn {
    margin-top: 15px;
    background: #dc3545;
    padding: 10px;
    border-radius: 8px;
}

.delete-btn:hover {
    background: #b52a37;
}
/* FILTER CARD */
.filter-card {
    background: white;
    padding: 15px;
    border-radius: 12px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.08);
}

/* LABEL */
.filter-card label {
    display: block;
    font-size: 14px;
    color: #555;
    margin-bottom: 6px;
}

/* SELECT STYLE */
#hallFilter {
    width: 100%;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid #ccc;
    background: #f9f9f9;
    transition: 0.2s;
}

#hallFilter:focus {
    border-color: #007bff;
    outline: none;
    background: white;
}
    </style>
</head>

<body>

<div class="container">

    <h2>CARITAS HALL BOOKING</h2>

    <div class="main-layout">

        <div class="left-panel">

            <div class="card">
                <div class="row">
                    <select id="hall">
                        <option>Diamond Jubilee Hall</option>
                        <option>Seminar Hall</option>
                        <option>CCI Conference Hall</option>
                        <option>Admin Conference Hall</option>
                    </select>

                    <input type="text" id="user" placeholder="Your Name">
                </div>

                <div class="row">
                    <input type="date" id="startDate">
                    <input type="time" id="startTime">
                </div>

                <div class="row">
                    <input type="date" id="endDate">
                    <input type="time" id="endTime">
                </div>

                <div class="row">
                    <input type="text" id="subject" placeholder="Subject">
                    <input type="number" id="mobile" placeholder="Mobile">
                </div>

                <button onclick="bookHall()">Book Hall</button>
            </div>

            <div class="card filter-card">
    <label>Filter by Hall</label>
    <select id="hallFilter" onchange="reloadCalendar()">
        <option value="ALL">All Halls</option>
        <option>Diamond Jubilee Hall</option>
        <option>Seminar Hall</option>
        <option>CCI Conference Hall</option>
        <option>Admin Conference Hall</option>
    </select>
</div>

        </div>

        <div class="right-panel">
            <div id="calendar"></div>
        </div>

    </div>
</div>

<!-- POPUP -->
<div id="popup">
    <div class="popup-card">
        
        <div class="popup-header">
            <h3>Booking Details</h3>
            <button class="close-btn" onclick="closePopup()">✖</button>
        </div>

        <div id="popupContent"></div>

    </div>
</div>

<script>
let calendar;

function closePopup() {
    document.getElementById("popup").style.display = "none";
}

function reloadCalendar() {
    if (calendar) calendar.refetchEvents();
}

function bookHall() {
    fetch('/book', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
            hall: hall.value,
            startDate: startDate.value,
            startTime: startTime.value,
            endDate: endDate.value,
            endTime: endTime.value,
            user: user.value,
            subject: subject.value,
            mobile: mobile.value
        })
    })
    .then(res => res.json())
    .then(data => {
        if (data.error) alert(data.error);
        else location.reload();
    });
}

// 🔥 DELETE FUNCTION
function deleteBooking(id) {
    console.log("Deleting ID:", id); // debug

    if (!confirm("Delete this booking?")) return;

    fetch('/deleteBooking', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id: id })
    })
    .then(res => res.json())
    .then(data => {
        console.log(data); // debug

        if (data.error) {
            alert(data.error);
        } else {
            alert("Deleted successfully");
            closePopup();
            calendar.refetchEvents();
        }
    })
    .catch(err => {
        console.error("Delete error:", err);
        alert("Delete failed");
    });
}

document.addEventListener('DOMContentLoaded', function () {

    calendar = new FullCalendar.Calendar(document.getElementById('calendar'), {
        initialView: 'dayGridMonth',
        height: '100%',

        events: function(fetchInfo, successCallback, failureCallback) {
            const hall = document.getElementById("hallFilter").value;

            fetch(`/bookings?hall=${encodeURIComponent(hall)}`)
            .then(res => res.json())
            .then(data => {
                successCallback(data.map(b => ({
                    title: `${b.hall} - ${b.user}`,
                    start: `${b.startDate}T${b.startTime}`,
                    end: `${b.endDate}T${b.endTime}`,
                    extendedProps: {
                        ...b,
                        id: b.id   // ✅ ID included
                    }
                })));
            })
            .catch(err => failureCallback(err));
        },

        eventClick: function(info) {
            const e = info.event.extendedProps;

            popup.style.display = "block";
            popupContent.innerHTML = `
                <h3>Booking Details</h3>
                <p><b>ID:</b> ${e.id}</p>
                <p><b>Hall:</b> ${e.hall}</p>
                <p><b>User:</b> ${e.user}</p>
                <p><b>Start:</b> ${e.startDate} ${e.startTime}</p>
                <p><b>End:</b> ${e.endDate} ${e.endTime}</p>
                <p><b>Subject:</b> ${e.subject}</p>
                <p><b>Mobile:</b> ${e.mobile}</p>

                <button onclick="deleteBooking(${e.id})" class="delete-btn">
    🗑 Delete Booking
</button>
            `;
        }
    });

    calendar.render();
});
</script>

</body>
</html>
